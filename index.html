<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Clientes</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Carga del cliente JS oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <h2>CATÁLOGO DE CLIENTES</h2>

        <form id="formCliente" onsubmit="return false;">
            <div class="form-group">
                <label for="clave">Clave:</label>
                <input type="text" id="clave" autocomplete="off" required>
            </div>
            
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad">
            </div>

            <div class="form-group">
                <label for="fecha_nacimiento">Fecha nacimiento:</label>
                <input type="date" id="fecha_nacimiento">
            </div>

            <div class="botones">
                <button type="button" id="btnNuevo">Nuevo</button>
                <button type="button" id="btnGuardar">Guardar</button>
                <button type="button" id="btnEliminar">Eliminar</button>
            </div>
        </form>

        <div class="table-container">
            <table id="gridClientes">
                <thead>
                    <tr>
                        <th>Clave</th>
                        <th>Nombre</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                    <!-- Filas cargadas dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
